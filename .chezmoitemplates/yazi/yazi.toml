[mgr]
show_hidden = true

[opener]
edit = [
  { run = 'nvim %s', block = true, desc = "nvim", for = "unix" },
  { run = 'nvim %s', block = true, desc = "nvim", for = "windows" },
]
reveal = [
  { run = 'xdg-open %d1', desc = "Reveal", for = "linux" },
  { run = 'open -R %s1', desc = "Reveal", for = "macos" },
  { run = 'explorer /select, %s1', orphan = true, desc = "Reveal", for = "windows" },
  { run = '''exiv2 %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
play = [
  { run = 'iina --no-stdin %s', orphan = true, for = "macos" },
  { run = 'vlc %s1', orphan = true, for = "windows" },
  { run = 'mpv %s', orphan = true, for = "linux" },
]

[plugin]
{{- if eq .chezmoi.os "windows" }}
prepend_previewers = [
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w --style="{{ .chezmoi.homeDir }}/AppData/Roaming/ylow/catppuccin-mocha.json" "$1"' },
  { url = "*.csv", run = 'piper -- bat -p --color=always "$1"' },
  { mime = "text/*", run = 'piper -- bat -p --color=always "$1"' },
  { url = "*/", run = 'piper -- eza -TL=1 --icons=always --color=always --sort=extension "$1"' },
]
{{- else }}
prepend_previewers = [
  { url = "*.md", run = 'faster-piper --rely-on-preloader' },
  { url = "*.csv", run = 'faster-piper --rely-on-preloader' },
  { mime = "text/*", run = 'faster-piper --rely-on-preloader' },
  { url = "*/", run = 'faster-piper --rely-on-preloader' },
]
prepend_preloaders = [
  { url = "*.md", run = 'faster-piper -- CLICOLOR_FORCE=1 glow -w=$w --style="{{ .chezmoi.homeDir }}/.config/glow/catppuccin-mocha.json" "$1"' },
  { url = "*.csv", run = 'faster-piper -- bat -p --color=always "$1"' },
  { mime = "text/*", run = 'faster-piper -- bat -p --color=always "$1"' },
  { url = "*/", run = 'faster-piper -- eza -TL=1 --icons=always --color=always --sort=extension "$1"' },
]
{{ end }}
