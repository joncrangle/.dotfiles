[bar.default]
background_opacity = 0.89999997988343239
capsule = true
capsule_group = []
concave_edge_corners = false
end = [ "media", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "notifications", "session" ]
font_family = "Liberation Sans"
margin_edge = 3
margin_ends = 10
start = [ "launcher", "workspaces" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/jon/.config/hypr/wallpapers"

    [wallpaper.default]
    path = "/home/jon/.config/hypr/wallpapers/astronaut.png"

    [wallpaper.last]
    path = "/home/jon/.config/hypr/wallpapers/astronaut.png"

    [wallpaper.monitors.DP-1]
    path = "/home/jon/.config/hypr/wallpapers/astronaut.png"

[widget.clock]
color = "secondary"
format = "{:%H:%M %a, %b %d}"

[widget.launcher]
color = "primary"
glyph = "navigation-search"

[widget.media]
color = "tertiary"
icon_color = "tertiary"

[widget.session]
color = "error"

[widget.workspaces]
labels_only_when_occupied = true
